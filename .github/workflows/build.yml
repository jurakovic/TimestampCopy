name: Build

# Runs the tests and publishes both executables for every push and pull
# request, the same way step 1 of the Publish workflow does (see publish.yml).
# Publishing trims the framework, and TreatWarningsAsErrors turns the
# trimmer's warnings into errors, so this also checks that trimming keeps what
# the app needs.
#
# The version is the one the next release from this branch would get. The
# published folder is uploaded for testing; releases are made with the
# Publish workflow.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, to compute the version
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test and publish
        run: |
          chmod +x ./publish.sh
          ./publish.sh publish -u true

      - name: Check the published tscp.exe starts
        run: ./publish/win-x64/tscp.exe -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TimestampCopy-win-x64
          path: publish/win-x64
          if-no-files-found: error
